spring:
  datasource:
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  web:
    allowed-origins: ${APP_WEB_ALLOWED_ORIGINS}
  persistence:
    enabled: true

rag:
  knowledge-path: ${RAG_KNOWLEDGE_PATH}

